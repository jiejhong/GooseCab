<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GooseCab · 交互观察室</title>
<style>
:root{color-scheme:light;--ink:#23352f;--muted:#6e8077;--line:#dce5dd;--green:#245d48;--paper:#fffefa}*{box-sizing:border-box}body{margin:0;background:#f2f5ef;color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:10px 16px;font-weight:600}button:hover{border-color:var(--green);background:#eff5ed}button:disabled{cursor:wait;opacity:.5}button.primary{background:var(--green);border-color:var(--green);color:white}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #a6bd89;outline-offset:3px}input{min-width:0;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.shell{max-width:1160px;margin:auto;padding:38px 28px 64px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.brand{font-size:13px;letter-spacing:.16em;color:var(--green);font-weight:800}.brand span{color:var(--muted);font-weight:400;letter-spacing:.05em;margin-left:14px}h1{font-size:34px;line-height:1.25;letter-spacing:-.03em;margin:12px 0}p{margin:0}.subtitle{color:var(--muted)}.stamp{background:#e7eee0;border-radius:50%;width:76px;height:76px;display:grid;place-items:center;font-size:29px;flex-shrink:0}.controls{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 20px #23352f05}.form-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:12px;align-items:end}label{display:block;font-size:12px;font-weight:700;color:var(--muted)}label input{margin-top:6px;font-weight:400}.hint{font-size:12px;color:var(--muted);margin-top:12px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;margin-top:28px}.aside{align-self:start}.aside h2{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 14px}.room-name{font-size:22px;font-weight:750;overflow-wrap:anywhere}.metrics{display:flex;gap:25px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin:20px 0}.metric strong{display:block;font-size:25px}.metric span{font-size:12px;color:var(--muted)}.legend{font-size:13px;margin:12px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:#5d846d}.dot.tool{background:#ab8850}.dot.system{background:#87919d}.service{font-size:12px;color:var(--muted);margin-top:26px;overflow-wrap:anywhere}.service summary{cursor:pointer}.service dl{margin:10px 0}.service dt{font-weight:bold}.service dd{margin:0 0 8px}.timeline-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:0 0 18px}.timeline-head h2{font-size:17px;margin:0}.badge{font-size:11px;border:1px solid var(--line);border-radius:30px;padding:3px 9px;color:var(--muted);background:#ffffff80;white-space:nowrap}#state{font-size:13px;margin-bottom:18px;color:var(--muted)}#state.error{color:#a03930}.empty{text-align:center;padding:65px 20px;background:#fffefa;border:1px dashed #cbd7ca;border-radius:16px;color:var(--muted)}.empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:8px}.entry{display:flex;gap:12px;margin:0 0 22px}.avatar{flex:0 0 36px;height:36px;background:#dce8d8;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:750;color:var(--green)}.entry.user{flex-direction:row-reverse}.entry.user .avatar{background:#e0e8f0;color:#4d6282}.content{min-width:0;flex:1}.entry.user .content{max-width:88%}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:6px}.meta strong{font-size:13px;color:var(--ink);overflow-wrap:anywhere}.meta time{margin-left:auto}.bubble{border:1px solid var(--line);border-radius:0 15px 15px 15px;padding:15px 18px;background:var(--paper);overflow:hidden;box-shadow:0 3px 12px #23352f03}.user .bubble{background:#e9f0e5;border-radius:15px 0 15px 15px}.event-card{border-left:3px solid #b69862}.system-card{border-left-color:#93a1ae}.event-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:750;margin-bottom:9px}.message{white-space:pre-wrap;overflow-wrap:anywhere}.fields{font-size:12px;margin:8px 0 0;display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 10px}.fields dt{color:var(--muted)}.fields dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.raw{font-size:11px;color:var(--muted);margin-top:12px}.raw summary{cursor:pointer}.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;padding:12px;background:#f2f5ef;border-radius:8px;font:11px/1.6 ui-monospace,monospace;color:#526359}progress{display:block;width:100%;height:7px;accent-color:var(--green);margin:10px 0}.footer{text-align:center;font-size:12px;color:var(--muted);padding:12px}#more{display:block;margin:8px auto 16px}#more[hidden]{display:none}@media(max-width:760px){.shell{padding:24px 16px}.masthead{margin-bottom:22px}h1{font-size:28px}.stamp{width:55px;height:55px;font-size:22px}.form-row{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr;gap:20px}.aside{display:grid;grid-template-columns:1fr auto;gap:8px 20px}.aside h2{margin:0}.room-name{grid-column:1}.metrics{grid-column:2;grid-row:1/3;margin:0;padding:0;border:0}.legend,.service{display:none}.controls{padding:15px}.meta time{margin-left:0}.bubble{padding:12px}.brand span{display:none}.entry{gap:8px}.avatar{flex-basis:30px;height:30px}.entry.user .content{max-width:88%}}@media(prefers-reduced-motion:no-preference){.entry{animation:appear .2s ease-out}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="shell">
<header class="masthead"><div><div class="brand">GOOSECAB <span>鸿梦阁 · GATEWAY</span></div><h1>让每一次协作，都有迹可循。</h1><p class="subtitle">聊天、能力调用与执行结果，在同一条时间线上展开。</p></div><div class="stamp" aria-hidden="true">✳</div></header>
<section class="controls" aria-label="房间与访问设置"><form id="room-form" class="form-row"><label>房间 ID<input id="room" name="room" value="default" maxlength="256" required autocomplete="off"></label><label>访问令牌 · 启用认证时填写<input id="token" type="password" placeholder="仅在当前页面内存中使用" autocomplete="off" spellcheck="false"></label><button id="refresh" class="primary" type="submit">刷新记录</button><button id="export" type="button">↓ 导出 HTML</button></form><p class="hint">只读观察 · 记录加载完毕后，每 5 秒自动更新（仅当前可见页面） · 房间 ID 最多 256 UTF-8 字节 · 导出完整房间记录，不受当前分页影响（最多 10,000 条）</p></section>
<div class="layout"><aside class="aside"><h2>当前房间 / ROOM</h2><div id="room-name" class="room-name">default</div><div class="metrics"><div class="metric"><strong id="shown">0</strong><span>已展示</span></div><div class="metric"><strong id="total">—</strong><span>快照记录</span></div></div><p class="legend"><span class="dot"></span>对话消息</p><p class="legend"><span class="dot tool"></span>能力与执行</p><p class="legend"><span class="dot system"></span>系统与其他事件</p><details class="service"><summary>网关服务信息</summary><dl id="config"></dl><p>页面只读，不会在线修改配置。</p></details></aside>
<main><div class="timeline-head"><h2>交互时间线</h2><span class="badge">时间顺序 · 已脱敏</span></div><p id="state" role="status" aria-live="polite">准备加载记录…</p><div id="events" aria-label="交互记录"></div><button id="more" hidden type="button">加载更多记录</button><div class="footer">GooseCab · 保留协作的上下文</div></main></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const initialRoom=new URLSearchParams(location.search).get('room_id')||'default';
$('room').value=initialRoom;
let room=initialRoom, token='', generation=0, controller=null, exportController=null, busy=false, exporting=false;
let snapshot=null, snapshotCursor='', nextSeq=0, nextID='', hasMore=false, count=0, pollTimer=null, pollEnabled=false;
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n;}
function value(v){return typeof v==='string'?v:JSON.stringify(v,null,2);}
function notify(message,error=false){$('state').textContent=message;$('state').className=error?'error':'';}
function buttons(){$('more').disabled=busy;$('more').hidden=!hasMore;$('export').disabled=exporting;$('export').textContent=exporting?'正在生成…':'↓ 导出 HTML';}
function placeholder(title,description){const box=node('div','empty');box.append(node('strong','',title),node('p','',description));$('events').replaceChildren(box);}
function authHeaders(){return token?{Authorization:'Bearer '+token}:{};}
function errorMessage(status){if(status===401||status===403)return '访问被拒绝，请检查访问令牌后重试。';if(status===413)return '记录超过导出上限（10,000 条），请通过导出 API 的 after_seq / through_seq 参数选择较小范围。';if(status===404)return '未找到记录接口，请确认网关版本。';return '请求失败（HTTP '+status+'），请稍后重试。';}
function fields(parent,items){const dl=node('dl','fields');for(const [label,v] of items){if(v===undefined||v===null||v==='')continue;dl.append(node('dt','',label),node('dd','',value(v)));}if(dl.childNodes.length)parent.append(dl);}
function render(event){
 const p=event.payload&&typeof event.payload==='object'&&!Array.isArray(event.payload)?event.payload:{};
 const actor=event.actor||{},who=actor.id||p.agent_id||'系统',type=String(event.type||'未知事件');
 const chat=type==='chat.message', capability=type.startsWith('capability.'), user=chat&&actor.kind==='user';
 const entry=node('article','entry'+(user?' user':''));entry.append(node('div','avatar',String(who).slice(0,2).toUpperCase()));
 const content=node('div','content'),meta=node('div','meta');meta.append(node('strong','',who),node('span','',actor.kind||'system'),node('span','badge','#'+event.seq));
 const date=new Date(event.ts),time=node('time','',isNaN(date.getTime())?String(event.ts||'时间未知'):date.toLocaleString('zh-CN',{hour12:false}));if(!isNaN(date.getTime()))time.dateTime=date.toISOString();meta.append(time);content.append(meta);
 const body=node('div','bubble'+(chat?'':capability?' event-card':' event-card system-card'));
 if(chat){body.append(node('div','message',p.text??p.message??p.content??(event.payload==null?'（空消息）':value(event.payload))));}
 else{
  let title=type;if(type.includes('progress'))title='执行进度';else if(type.includes('result'))title='执行结果';else if(type.includes('invoke'))title='发起能力调用';else if(type==='capability.announce')title='能力上线';else if(type==='agent.hello'||type==='agent.welcome')title='Agent 已连接';
  body.append(node('div','event-title',title),node('div','badge',type));
  if(p.message||p.error)body.append(node('p','message',p.message||p.error));
  const percent=Number(p.percent);if(type.includes('progress')&&p.percent!==undefined&&Number.isFinite(percent)){const bar=node('progress');bar.max=100;bar.value=Math.min(100,Math.max(0,percent));bar.setAttribute('aria-label','执行进度 '+bar.value+'%');body.append(bar,node('span','',bar.value+'%'));}
  fields(body,[['能力',event.capability_id||p.capability_id],['名称',p.name],['接收方',p.target_agent_id],['状态',p.status],['输出',p.output_ref],['调用参数',p.payload],['关联 ID',event.correlation_id||p.request_id]]);
  if(!capability&&!p.message&&!p.error&&event.payload!==undefined)body.append(node('div','message',value(event.payload)));
 }
 const details=node('details','raw');details.append(node('summary','','查看脱敏 JSON'),node('pre','',JSON.stringify(event,null,2)));body.append(details);content.append(body);entry.append(content);return entry;
}
function stopPolling(){pollEnabled=false;clearTimeout(pollTimer);pollTimer=null;}
function schedulePoll(){clearTimeout(pollTimer);if(!pollEnabled||hasMore)return;pollTimer=setTimeout(()=>{if(!pollEnabled)return;if(document.hidden||busy||exporting){schedulePoll();return;}load(false,true);},5000);}
function validRoom(target){if(new TextEncoder().encode(target).length>256){notify('房间 ID 不能超过 256 个 UTF-8 字节（中文通常占 3 字节）。',true);return false;}return true;}
async function load(reset=false,poll=false){
 if(!reset&&busy)return;
 if(reset){stopPolling();generation++;if(controller)controller.abort();if(exportController)exportController.abort();exporting=false;room=$('room').value.trim()||'default';$('room').value=room;token=$('token').value; refreshStatus(); snapshot=null;snapshotCursor='';nextSeq=0;nextID='';hasMore=false;count=0;pollEnabled=true;$('room-name').textContent=room;$('shown').textContent='0';$('total').textContent='—';placeholder('正在读取房间记录','获取已持久化的交互快照…');}
 if(!validRoom(room)){stopPolling();busy=false;buttons();return;}
 const gen=generation;controller=new AbortController();const signal=controller.signal;busy=true;buttons();if(!poll)notify('正在加载记录…');
 try{
  const query=new URLSearchParams({room_id:room,limit:'200'});if(snapshot!==null){if(!poll){query.set('through_seq',String(snapshot));query.set('through_cursor',snapshotCursor);}query.set('after_seq',String(nextSeq));if(nextID!=='')query.set('after_cursor',nextID);}
  const response=await fetch('/api/events?'+query,{headers:authHeaders(),signal,cache:'no-store'});if(!response.ok)throw new Error(errorMessage(response.status));const data=await response.json();if(gen!==generation)return;
  if(data.redacted!==true||!Array.isArray(data.events))throw new Error('记录响应格式不正确，已停止展示。');
  if(data.events.some(e=>!e||e.room_id!==data.room_id))throw new Error('房间记录响应不一致，已停止展示。');
  if(snapshot===null||poll){snapshot=data.snapshot_seq;snapshotCursor=data.snapshot_cursor;}
  if(count===0)$('events').replaceChildren();
  const fragment=document.createDocumentFragment();for(const e of data.events){fragment.append(render(e));count++;}$('events').append(fragment);
  const oldSeq=nextSeq,oldID=nextID;nextSeq=data.next_seq;nextID=data.next_cursor||'';hasMore=Boolean(data.has_more);
  if(hasMore&&(data.events.length===0||(nextSeq===oldSeq&&nextID===oldID)))throw new Error('分页未前进，请刷新记录后重试。');
  $('shown').textContent=String(count);$('total').textContent=String(data.total??count);notify('快照 #'+snapshot+' · 已展示 '+count+' / '+(data.total??count)+' 条 · '+(hasMore?'可继续加载':'已加载全部，每 5 秒自动更新'));
  if(count===0)placeholder('这个房间还很安静','暂无持久化交互。Agent 发送消息或执行任务后，点击刷新查看。');
 }catch(error){if(gen!==generation||error.name==='AbortError')return;stopPolling();notify((error.message==='Failed to fetch'?'无法连接网关，请检查网络后重试。':error.message)+' 自动更新已暂停，请手动刷新。',true);if(count===0)placeholder('暂时无法加载','检查房间、访问令牌和服务状态，然后刷新重试。');}
 finally{if(gen===generation){busy=false;buttons();schedulePoll();}}
}
$('room-form').addEventListener('submit',e=>{e.preventDefault();load(true);});
// Cancel outstanding requests as soon as the user changes the room or credential.
for(const id of ['room','token'])$(id).addEventListener('input',()=>{stopPolling();generation++;$('config').replaceChildren();if(controller)controller.abort();if(exportController)exportController.abort();busy=false;exporting=false;hasMore=false;count=0;$('shown').textContent='0';$('total').textContent='—';$('room-name').textContent=$('room').value.trim()||'default';placeholder('设置已更改','点击刷新记录，或导出所选房间。');notify('点击刷新以应用当前房间和令牌。');buttons();});
$('more').addEventListener('click',()=>load());
$('export').addEventListener('click',async()=>{
 if(exporting)return;const target=$('room').value.trim()||'default',credential=$('token').value,gen=generation;if(!validRoom(target))return;exportController=new AbortController();exporting=true;buttons();notify('正在生成完整房间的 HTML 聊天记录…');
 try{const response=await fetch('/api/events/export.html?'+new URLSearchParams({room_id:target}),{headers:credential?{Authorization:'Bearer '+credential}:{},signal:exportController.signal,cache:'no-store'});if(!response.ok)throw new Error(errorMessage(response.status));const blob=await response.blob();if(gen!==generation)return;const url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='GooseCab-chat-history-'+new Date().toISOString().slice(0,10)+'.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('HTML 文件已生成并交由浏览器下载，包含该房间完整快照。');}
 catch(error){if(gen!==generation||error.name==='AbortError')return;notify(error.message==='Failed to fetch'?'无法连接网关，导出失败。':error.message,true);}
 finally{if(gen===generation){exporting=false;buttons();}}
});
async function refreshStatus(){
 const gen=generation;const headers=authHeaders();$('config').replaceChildren();
 try{const response=await fetch('/api/status',{headers,cache:'no-store'});if(!response.ok)throw new Error();const v=await response.json();if(gen!==generation)return;const names={service:'服务',addr:'监听地址',token_required:'访问认证',agent_endpoint:'Agent 端点'};for(const key of Object.keys(names)){if(v[key]!==undefined)$('config').append(node('dt','',names[key]),node('dd','',key==='token_required'?(v[key]?'已启用':'未启用'):String(v[key])));}}
 catch(error){if(gen===generation)$('config').append(node('dd','','服务状态暂不可用，请检查访问令牌后刷新。'));}
}
load(true);
</script>
</body>
</html>
