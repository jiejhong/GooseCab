name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::warning::Files not gofmt-formatted:"
            echo "$files"
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
