name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::warning::Files not gofmt-formatted:"
            echo "$files"
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Observer UI smoke test
        run: node tests/observer.test.cjs
      - name: Real process collaboration smoke test
        run: python3 tests/collaboration-smoke.py
      - name: Skill MCP and knowledge process smoke test
        run: python3 tests/providers-smoke.py

  native-same-port-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check preinstalled browser tools and install Playwright
        run: |
          command -v certutil
          openssl version
          chromium --version
          python -m pip install --disable-pip-version-check --timeout 20 --retries 2 playwright==1.62.0
      - name: Build Gateway and base-branch Agent with locked dependencies
        env:
          GOOSE_TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/goosecab-agent-baseline" "$GOOSE_TEST_BASE"
          go build -mod=readonly -o "$RUNNER_TEMP/goosecab-gateway" ./cmd/server
          go build -mod=readonly -o "$RUNNER_TEMP/goosecab-chat-mcp" ./cmd/chat-mcp
          go test -mod=readonly -c -o "$RUNNER_TEMP/goosecab-demo.test" ./cmd/server
          go -C "$RUNNER_TEMP/goosecab-agent-baseline" build -buildvcs=false -mod=readonly \
            -o "$RUNNER_TEMP/goosecab-baseline-agent" ./cmd/agent
      - name: Exercise native same-port TLS with a trusted synthetic CA
        run: |
          python tests/gateway-native-same-port-browser.py \
            "$RUNNER_TEMP/goosecab-gateway" "$RUNNER_TEMP/goosecab-baseline-agent" --chromium "$(command -v chromium)"

      - name: Exercise original demo, legacy Agent and private Chat MCP delivery
        run: |
          python tests/gateway-native-same-port-browser.py \
            "$RUNNER_TEMP/goosecab-gateway" "$RUNNER_TEMP/goosecab-baseline-agent" --chromium "$(command -v chromium)" \
            --demo-chat-mcp "$RUNNER_TEMP/goosecab-chat-mcp"

      - name: Exercise allowlisted demo writer and baseline Agent
        run: |
          python tests/gateway-native-same-port-browser.py \
            "$RUNNER_TEMP/goosecab-gateway" "$RUNNER_TEMP/goosecab-baseline-agent" --chromium "$(command -v chromium)" \
            --allowlisted-demo-fixture "$RUNNER_TEMP/goosecab-demo.test"
